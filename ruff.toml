line-length = 88

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "T20",
    "ASYNC",
]

ignore = [
    "B008",
]

[lint.per-file-ignores]
"tests/**/*.py" = [
    "T20",    # print() permitido en tests
]
"scripts/**/*.py" = [
    "T20",    # print() permitido en scripts CLI (reporte de load test)
]

[lint.isort]
known-first-party = ["app"]

[format]
quote-style = "double"
indent-style = "space"